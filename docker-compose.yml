services:
  db:
    image: postgres:15-alpine
    container_name: todo_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: ${DOCKERHUB_USERNAME:-local}/todo-backend:latest
    build: .
    container_name: todo_web
    restart: always
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password123@db:5432/tododb}
    depends_on:
      - db

volumes:
  postgres_data:
